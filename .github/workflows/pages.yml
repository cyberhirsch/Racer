name: Website

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deployment at a time; never cancel one midway, or the live site can be
# left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    name: Check the site loads and plays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npx playwright install` only downloads the browser; the check script
      # imports the playwright module too, so it has to be installed.
      - name: Install Playwright and a browser
        run: |
          npm install --prefix web
          npx --prefix web playwright install --with-deps chromium

      # Deploying a broken page is worse than not deploying: load the site,
      # start a race, and check the car actually moves.
      - name: Play the game in a real browser
        run: node web/tools/browser-check.mjs

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-check-failure
          path: web-check-*.png
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
