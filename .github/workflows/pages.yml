name: Website

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deployment at a time; never cancel one midway, or the live site can be
# left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    name: Check the site loads and plays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npx playwright install` only downloads the browser; the check script
      # imports the playwright module too, so it has to be installed.
      - name: Install Playwright and a browser
        run: |
          npm install --prefix web
          npx --prefix web playwright install --with-deps chromium

      # Deploying a broken page is worse than not deploying: load the site,
      # start a race, and check the car actually moves.
      - name: Play the game in a real browser
        run: node web/tools/browser-check.mjs

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-check-failure
          path: web-check-*.png
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the gh-pages fallback pushes a branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages has to be switched on once by hand, in
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The workflow token can deploy to Pages but cannot create the site —
      # that needs repository admin rights, which GITHUB_TOKEN never has.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      # Fallback: publish to a gh-pages branch instead. GitHub has long
      # treated that branch as a site automatically, so this can work without
      # anyone touching the repository settings — and where it does not, the
      # branch is still there to point Pages at.
      - name: Publish to the gh-pages branch instead
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning::Pages is not enabled for GitHub Actions; publishing the gh-pages branch instead."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/site
          cp -r web /tmp/site
          # Stop Jekyll from touching the files; this is a plain static site.
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git add -A
          git commit -q -m "Publish the web version from ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Pushed the site to the gh-pages branch."
          echo "If it is not live shortly at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/,"
          echo "set Settings -> Pages -> Source to either 'GitHub Actions' or 'Deploy from a branch: gh-pages'."

      - name: Upload the site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
