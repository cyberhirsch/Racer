name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Game logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :core has no Android dependencies, so this runs without the SDK and
      # gives fast feedback on the physics, tracks, meshes and level flow.
      - name: Run unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: racer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Signed with the debug key, so it installs straight from the artifact.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: racer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  smoke:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # This job's value is the emulator run, and the cache write-back logs
          # far more than the screenshot preview printed at the end of it.
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Actually run the thing. The unit tests cover the game logic, but only a
      # real device proves the OpenGL renderer, the sensor plumbing and the
      # Compose HUD survive contact with Android.
      - name: Launch on an emulator and screenshot it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # A software GL pipe still exercises the real driver stack and our
          # shaders; hardware GL is not available on a CI runner.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/smoke-test.sh

      # The artifact store is not reachable from every environment, so also
      # print a downscaled screenshot into the log, where anyone reading the
      # run can decode it and look at the rendering.
      - name: Print screenshot previews
        if: always()
        run: |
          # The game's own progress log is the real evidence; the previews let
          # a human confirm it looks right.
          grep -E "Racer.*(state ->|racing |level )" smoke-output/logcat.txt | tail -25 || true
          cat smoke-output/preview-menu.txt || true
          cat smoke-output/preview.txt || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke-output
          if-no-files-found: ignore

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [apk, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: racer-release-apk
          path: apk

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
