name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Game logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :core has no Android dependencies, so this runs without the SDK and
      # gives fast feedback on the physics, tracks, meshes and level flow.
      - name: Run unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: racer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Signed with the debug key, so it installs straight from the artifact.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: racer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: racer-release-apk
          path: apk

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
